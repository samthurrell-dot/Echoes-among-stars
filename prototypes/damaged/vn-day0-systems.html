.stat{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.stat-label{font-size:12px;color:#b3c0da;width:110px}

.bar>span{display:block;height:100%}
.trust{background:linear-gradient(90deg,#5ee898,#2bb673)}
.rep{background:linear-gradient(90deg,#ffd36c,#ffb84a)}
.toolbar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.toolbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#eaf1ff;padding:6px 10px;border-radius:10px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal.active{display:flex}
.sheet{width:min(960px,100%);max-height:86vh;overflow:auto;background:#0e1423;border:1px solid rgba(255,255,255,.15);border-radius:16px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12);position:sticky;top:0;background:#0e1423}
.sheet .bd{padding:14px}
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.loc{position:relative;border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;min-height:120px;background:#0b1220}
.loc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.loc .label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.14);font-size:13px}

/* === VN helpers === */
const el=(q)=>document.querySelector(q);
function setBG(path){ document.querySelector("#background-image").src = path; }
function setBGKey(key){ setBG(BG[key]||key||""); }
function setPortrait(name){ document.querySelector("#character-portrait").style.backgroundImage = name?`url('${PORTRAIT[name]||PORTRAIT[name+'_neutral']||""}')`:"none"; }
function say(name,text){ document.querySelector("#character-name").textContent=name||""; document.querySelector("#dialogue-text").innerHTML=text||""; }
function setChoices(choices){ const host=document.querySelector("#choice-buttons"); host.innerHTML=""; (choices||[]).forEach(ch=>{ const b=document.createElement("button"); b.className="choice-button"; b.textContent=ch.text; b.onclick=ch.on; host.appendChild(b); }); document.querySelector("#progress-button").disabled = (choices && choices.length>0); }
function renderHUD(){ document.querySelector("#captain-trust").textContent=state.captainTrust; document.querySelector("#trustBar").style.width=state.captainTrust+"%"; document.querySelector("#crew-reputation").textContent=state.crewRep; document.querySelector("#repBar").style.width=state.crewRep+"%"; document.querySelector("#dayActions").textContent=state.day+" / "+state.actions; }
function bumpTrust(v){ state.captainTrust=Math.max(0,Math.min(100,state.captainTrust+v)); }
function bumpRep(v){ state.crewRep=Math.max(0,Math.min(100,state.crewRep+v)); }

/* === Day 0 player of oldScenes === */
function playOldScene(id){ state.current={ id, idx:0, inline:null }; showOld(); }
function showOld(){
  renderHUD();
  const sc = oldScenes[state.current.id];
  if(!sc) return;
  if(state.current.idx===0 && sc.background) setBG(sc.background);
  // If inline dialogue (from a choice's nextDialogue) is running
  if(state.current.inline){
    const arr = state.current.inline;
    const i = state.current.idx;
    if(i >= arr.length){ state.current.inline=null; state.current.idx=0; 
      if(state.pendingNext){ const nxt=state.pendingNext; state.pendingNext=null; playOldScene(nxt); return; }
      setChoices([]); return;
    }
    const L = arr[i]; state.current.idx++;
    say(L.character||"", L.text||"");
    setPortrait(L.character==="Amelia"?"Amelia": (L.character && L.character.includes("Captain")?"Lawson": null));
    setChoices([]);
    return;
  }
  // Normal scene dialogue first
  const dia = sc.dialogue||[];
  if(state.current.idx < dia.length){
    const L = dia[state.current.idx++];
    say(L.character||"", L.text||"");
    setPortrait(L.character==="Amelia"?"Amelia": (L.character && L.character.includes("Captain")?"Lawson": (L.character && L.character.includes("Maintenance")?null:null)));
    setChoices([]);
    return;
  }
  // Then choices (no actions consumed in Day 0)
  const chs = sc.choices||[];
  if(chs.length>0){
    const mapped = chs.map(ch=>({
      text: ch.text,
      on: ()=>{ if(ch.crewReputation) bumpRep(ch.crewReputation); if(ch.captainTrust) bumpTrust(ch.captainTrust);
                if(ch.nextDialogue){ state.current.inline = ch.nextDialogue; state.current.idx=0; state.pendingNext = ch.nextScene||null; showOld(); return; }
                if(ch.nextScene){ playOldScene(ch.nextScene); return; }
              }
    }));
    setChoices(mapped);
    return;
  }
  // Follow-up choices if defined
  if(sc.followUpChoices && sc.followUpChoices.length>0){
    const mapped = sc.followUpChoices.map(ch=>({ text: ch.text, on: ()=>{ if(ch.nextScene) playOldScene(ch.nextScene); } }));
    setChoices(mapped); return;
  }
  // If we reach the end of Day 0 content, handoff to Day 1 systems loop
  setChoices([{text:"Start Day 1", on:()=>startDay1()}]);
}
document.querySelector("#progress-button").addEventListener("click",()=>{ if(document.querySelector("#choice-buttons").children.length===0){ if(state.mode==='day0') showOld(); else showNext(); } });

/* === Systems loop (Day 1+) — hidden during Day 0 === */
const CLUES = {
  dup_manifest:{name:"Duplicate Manifest",desc:"Two entries for same crate 3 minutes apart.",weight:8},
  emily_glance:{name:"Emily’s Glance",desc:"Flinch when manifest mentioned.",weight:5},
  overlap_shift:{name:"Shaw shift overlap",desc:"He worked both timestamps.",weight:10},
  whisper_logs:{name:"Hallway whisper",desc:"Someone fears log audit.",weight:6}
};
const LOCATIONS=[
  {id:"command_center", name:"Command Center", bg:BG.command_center, events:[
    {need:()=>true && !state.flags.cc_dup, run:()=>{ say("Terminal","You skim manifests. A crate is logged twice."); state.flags.cc_dup=true; state.clues.push("dup_manifest"); bumpTrust(+3); } },
  ]},
  {id:"dining_hall", name:"Dining Hall", bg:BG.dining_hall, events:[
    {need:()=>!state.flags.emily_met, run:()=>{ say("Emily","If something's off, I'll find it."); state.flags.emily_met=true; state.clues.push("emily_glance"); } }
  ]},
  {id:"docking_bay", name:"Docking Bay", bg:BG.docking_bay, events:[
    {need:()=>!state.flags.shaw_seen, run:()=>{ say("Shaw","Everything that lands goes through me."); state.flags.shaw_seen=true; state.clues.push("overlap_shift"); } }
  ]},
  {id:"hallway", name:"Hallway", bg:BG.hallway, events:[
    {need:()=>!state.flags.whisper, run:()=>{ say("—","\"If they check the logs, we're burned.\""); state.flags.whisper=true; state.clues.push("whisper_logs"); } }
  ]},
  {id:"quarters", name:"Quarters", bg:BG.quarters, events:[
    {need:()=>true, run:()=>{ say("Amelia","<i>Review notes. Keep going.</i>"); } }
  ]},
];

/* Simple Day 1 intro scene */
const SCENES = {
  d1_intro:[
    { bg:BG.quarters, name:"Amelia", text:"Day 1." },
    { choices:[{text:"Open Map", on:()=>openMap()}] }
  ]
};
function showNext(){
  const arr = SCENES[state.current.id]||[];
  const i = state.current.idx++;
  if(i>=arr.length){ setChoices([]); return; }
  const L = arr[i];
  if(L.bg) setBG(L.bg);
  say(L.name||"", L.text||"");
  setChoices(L.choices || []);
}

/* Map modal */
function openMap(){
  const host=document.querySelector("#mapGrid"); host.innerHTML="";
  LOCATIONS.forEach(loc=>{
    const div=document.createElement("div"); div.className="loc";
    const img=document.createElement("img"); img.src=loc.bg; div.appendChild(img);
    const lab=document.createElement("div"); lab.className="label"; lab.textContent=loc.name; div.appendChild(lab);
    const btn=document.createElement("button"); btn.onclick=()=>visit(loc.id); div.appendChild(btn);
    host.appendChild(div);
  });
  document.querySelector("#mapModal").classList.add("active");
}
function visit(id){
  if(state.mode==='day0') return; // Day 0 doesn't use map/actions
  if(state.actions<=0){ openReport(); return; }
  state.actions--; renderHUD();
  const loc=LOCATIONS.find(l=>l.id===id);
  const evt=(loc.events||[]).find(e=>!e._done && (!e.need || e.need())) || (loc.events||[])[0];
  if(evt){ evt.run(); if(evt.once!==false) evt._done=true; }
  document.querySelector("#mapModal").classList.remove("active");
  if(state.actions<=0) openReport();
}

/* Evidence + Report (disabled in Day 0) */
function renderEvidence(){
  if(state.mode==='day0') return;
  const sus=document.querySelector("#susList"); sus.innerHTML="";
  ["Lawson","Shaw","Emily"].forEach(s=>{
    const c=document.createElement("div"); c.className="card";
    c.innerHTML = "<div style='font-weight:600'>"+s+"</div><div class='meter'><span style='display:block;height:8px;background:linear-gradient(90deg,#a3b3ff,#6e86ff);width:0%'></span></div>";
    sus.appendChild(c);
  });
  const clues=document.querySelector("#clueList"); clues.innerHTML="";
  state.clues.forEach(id=>{ const row=document.createElement("div"); row.className="clue"; row.textContent=CLUES[id].name+" — "+CLUES[id].desc; clues.appendChild(row); });
}
function openReport(){
  if(state.mode==='day0') return;
  const host=document.querySelector("#reportChoices"); host.innerHTML="";
  state.clues.slice(-5).forEach(id=>{ const c=CLUES[id]; const lab=document.createElement("label"); lab.className="clue"; const cb=document.createElement("input"); cb.type="checkbox"; cb.value=id; cb.style.marginRight="8px"; lab.appendChild(cb); lab.appendChild(document.createTextNode(c.name+" — "+c.desc)); host.appendChild(lab); });
  document.querySelector("#reportModal").classList.add("active");
}
function submitReport(){
  const chosen=[...document.querySelectorAll("#reportChoices input:checked")].map(x=>x.value);
  bumpTrust(5*chosen.length);
  bumpRep(chosen.length===0?+8:chosen.length===1?+4:-2);
  state.day++; state.actions=3; // next day
  document.querySelector("#reportModal").classList.remove("active");
  state.current={id:"d1_intro", idx:0}; showNext(); renderHUD();
}
/* Start Day 1 */
function startDay1(){
  state.mode='loop'; state.day=1; state.actions=3; renderHUD();
  setBG(BG.quarters); say("Amelia","Day 1."); setChoices([{text:"Open Map", on:()=>openMap()}]);
}

/* Save/Load/Reset */
function save(){ localStorage.setItem(saveKey, JSON.stringify(state)); }
function load(){ const raw=localStorage.getItem(saveKey); if(!raw) return; state=JSON.parse(raw); renderHUD(); say("","Loaded."); }
function resetGame(){ localStorage.removeItem(saveKey); location.reload(); }

/* HUD buttons */
document.querySelector("#mapBtn").onclick=()=>{ if(state.mode==='day0') return; openMap(); };
document.querySelector("#evidenceBtn").onclick=()=>{ if(state.mode==='day0') return; renderEvidence(); document.querySelector("#evidenceModal").classList.add("active"); };
document.querySelector("#reportBtn").onclick=()=>{ if(state.mode==='day0') return; openReport(); };
document.querySelector("#mapClose").onclick=()=>document.querySelector("#mapModal").classList.remove("active");
/* ---- Rebuilt by Claude, Oct 2026: the original end of this file was lost to file damage. ---- */
document.querySelector("#evidenceClose").onclick=()=>document.querySelector("#evidenceModal").classList.remove("active");
document.querySelector("#reportClose").onclick=()=>document.querySelector("#reportModal").classList.remove("active");
document.querySelector("#submitReport").onclick=submitReport;
document.querySelector("#saveBtn").onclick=save;
document.querySelector("#loadBtn").onclick=load;
document.querySelector("#resetBtn").onclick=resetGame;

/* Boot */
renderHUD();
playOldScene(state.current.id);
</script>
