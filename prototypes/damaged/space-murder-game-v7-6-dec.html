<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes Among the Stars - Game UI</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Game Screen */
        #game-screen {
            width: 100%;
            height: 80vh;
            position: relative;
            overflow: hidden;
        }

        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Character Portrait */
        #character-portrait {
            position: absolute;
            bottom: 0;
            left: 20px;
            width: 300px;
            height: auto;
            z-index: 2;
        }

        #character-portrait img {
            width: 100%;
            height: auto;
        }

        /* Dialogue Box */
        #dialogue-box {
            position: relative;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            padding: 20px;
            box-sizing: border-box;
            z-index: 3;
            min-height: 150px;
        }

        #character-name {
            font-weight: bold;
            margin: 0 0 10px 0;
            font-size: 1.2em;
            color: #4a9eff;
        }

        #dialogue-text {
            margin: 0 0 20px 0;
            line-height: 1.5;
            font-size: 1.1em;
        }

        /* Buttons */
        .game-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 20px;
            background-color: #1a1a1a;
            color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
            z-index: 4;
        }

        .game-button:hover {
            background-color: #333;
            border-color: #444;
            transform: translateY(-2px);
        }

        .game-button.next {
            background-color: #2a6ba3;
            border-color: #3580c1;
        }

        .game-button.next:hover {
            background-color: #3580c1;
            border-color: #4591d2;
        }

        /* Choice Buttons */
        #choice-buttons {
            position: absolute;
            right: 20px;
            top: 60%;
            display: flex;
            flex-direction: column;
            width: 500px;
            z-index: 3;
            transform: translateY(-50%);
        }

        .choice-button {
            background-color: rgba(26, 26, 26, 0.9);
            color: #fff;
            padding: 15px 20px;
            margin-bottom: 10px;
            border: 1px solid #333;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .choice-button:hover {
            background-color: #333;
            transform: translateX(-5px);
        }

        .choice-button.disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 1000;
            border: 1px solid #333;
        }

        .stat {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-weight: bold;
            color: #888;
        }

        #crew-reputation,
        #captain-trust {
            color: #4a9eff;
            font-weight: bold;
        }

        /* Menu */
        #hamburger-icon {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1001;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        #hamburger-icon div {
            width: 100%;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
            transition: 0.4s;
            border-radius: 3px;
        }

        /* Sidebar */
        #sidebar-menu {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background-color: rgba(10, 10, 10, 0.95);
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        #close-button {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 36px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }

        #close-button:hover {
            color: #4a9eff;
        }

        .chapter-link {
            padding: 12px 32px;
            text-decoration: none;
            font-size: 18px;
            color: #fff;
            display: block;
            transition: 0.3s;
            border-bottom: 1px solid #333;
        }

        .chapter-link:hover {
            background-color: #2a6ba3;
            padding-left: 40px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1002;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-content {
            background-color: #1a1a1a;
            margin: 5% auto;
            padding: 25px;
            border: 1px solid #333;
            width: 80%;
            max-width: 800px;
            color: #fff;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .modal-close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-close-button:hover {
            color: #fff;
        }

        #modal-body {
            margin-top: 20px;
            line-height: 1.6;
        }

        /* Inventory Button */
        #inventory-button {
            position: fixed;
            top: 10px;
            left: 60px;
            padding: 8px 16px;
            background-color: #1a1a1a;
            color: #fff;
            border: 2px solid #333;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1001;
            transition: all 0.2s ease;
        }

        #inventory-button:hover {
            background-color: #333;
            border-color: #444;
            transform: translateY(-2px);
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #choice-buttons {
                width: 90%;
                right: 5%;
            }

            #character-portrait {
                width: 200px;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }
    </style>
</head>

        // Core Functions
        function loadScene(sceneName) {
            const sceneData = scenes[sceneName];
            if (!sceneData) {
                console.error('Scene not found:', sceneName);
                return;
            }

            // Reset scene state
            gameState.currentScene = sceneName;
            gameState.dialogueIndex = 0;
            gameState.currentDialogue = sceneData.dialogue;
            gameState.choicesAvailable = false;
            gameState.nextScene = null;
            gameState.isTransitioningScene = false;
            gameState.currentChoice = null;
            gameState.modalActive = false;

            // Update UI
            const backgroundImg = document.getElementById('background-image');
            backgroundImg.src = sceneData.background;
            backgroundImg.classList.add('fade-in');

            document.getElementById('character-portrait').innerHTML = '';
            document.getElementById('choice-buttons').innerHTML = '';

            gameState.currentSceneData = sceneData;
            updateProgressButton();
            showNextDialogue();
        }

function showNextDialogue() {
    if (gameState.modalActive || gameState.choicesAvailable) return;

    if (gameState.isTransitioningScene) {
        loadScene(gameState.nextScene);
        return;
    }

    if (gameState.currentDialogue && gameState.dialogueIndex < gameState.currentDialogue.length) {
        const line = gameState.currentDialogue[gameState.dialogueIndex];
        updateCharacterPortrait(line.character);
        document.getElementById('character-name').textContent = line.character;
        document.getElementById('dialogue-text').textContent = line.text;
        gameState.dialogueIndex++;
    } else {
        // End of dialogue handling
        if (gameState.nextScene) {
            // If there's a next scene queued up, transition to it
            gameState.isTransitioningScene = true;
        } else if (gameState.currentChoice && gameState.currentChoice.followUpChoices) {
            // If there are follow-up choices, show them
            showChoices(gameState.currentChoice.followUpChoices);
            gameState.choicesAvailable = true;
        } else if (gameState.currentSceneData.choices && !gameState.choicesAvailable) {
            // If there are scene choices and we haven't shown them yet, show them
            showChoices(gameState.currentSceneData.choices);
            gameState.choicesAvailable = true;
        }
    }
    
    updateProgressButton();
}

        function updateCharacterPortrait(character) {
            const portraits = {
                'Amelia': 'assets/images/Characters/Amelia_serious.png',
                'Maintenance Worker': 'assets/images/Characters/maintenance_worker.png',
                'Captain Lawson': 'assets/images/Characters/sarah.png',
                'Head Scientist': 'assets/images/Characters/head_scientist.png'
            };

            const portraitContainer = document.getElementById('character-portrait');
            if (portraits[character]) {
                portraitContainer.innerHTML = `<img src="${portraits[character]}" alt="${character}" class="fade-in">`;
            } else {
                portraitContainer.innerHTML = '';
            }
        }

        function updateProgressButton() {
            const button = document.getElementById('progress-button');
            button.classList.toggle('hidden', gameState.choicesAvailable);
            button.classList.toggle('next', gameState.isTransitioningScene);
            button.textContent = gameState.isTransitioningScene ? 'Next Scene ►►' : 'Continue ►';
        }

        function showChoices(choices) {
            const choiceContainer = document.getElementById('choice-buttons');
            choiceContainer.innerHTML = '';

            choices.forEach(choice => {
                if (choice.condition && !evaluateCondition(choice.condition)) return;

                const button = document.createElement('button');
                button.textContent = choice.text;
                button.classList.add('choice-button', 'fade-in');
                
                if (!choice.disabled) {
                    button.onclick = () => makeChoice(choice);
                } else {
                    button.classList.add('disabled');
                    button.disabled = true;
                }

                choiceContainer.appendChild(button);
            });
        }

function makeChoice(choice) {
    gameState.currentChoice = choice;
    document.getElementById('choice-buttons').innerHTML = '';
    gameState.choicesAvailable = false;

    // Handle stats changes
    if (choice.crewReputation !== undefined) {
        gameState.crewReputation += choice.crewReputation;
        document.getElementById('crew-reputation').textContent = gameState.crewReputation;
    }

    if (choice.captainTrust !== undefined) {
        gameState.captainTrust += choice.captainTrust;
        document.getElementById('captain-trust').textContent = gameState.captainTrust;
    }

    if (choice.onChoiceMade) {
        choice.onChoiceMade();
    }

    if (choice.modalContent) {
        openModal(choice.modalContent);
        return;
    }

    // Set up the next dialogue or scene transition
    if (choice.nextDialogue) {
        gameState.currentDialogue = choice.nextDialogue;
        gameState.dialogueIndex = 0;
        if (choice.nextScene) {
            // If there's both nextDialogue and nextScene, set up scene transition after dialogue
            gameState.nextScene = choice.nextScene;
        }
        showNextDialogue();
    } else if (choice.nextScene) {
        // If there's only nextScene, transition immediately
        gameState.nextScene = choice.nextScene;
        gameState.isTransitioningScene = true;
        updateProgressButton();
    }
}

        // Modal Functions
        function openModal(content) {
            gameState.modalActive = true;
            const modalWindow = document.getElementById('modal-window');
            document.getElementById('modal-body').innerHTML = content;
            modalWindow.style.display = 'block';
            setTimeout(() => modalWindow.classList.add('show'), 10);
        }

        function closeModal() {
            const modalWindow = document.getElementById('modal-window');
            modalWindow.classList.remove('show');
            setTimeout(() => {
                modalWindow.style.display = 'none';
                gameState.modalActive = false;

                // Check if there are follow-up choices for the current choice
                if (gameState.currentChoice && gameState.currentChoice.followUpChoices) {
                    showChoices(gameState.currentChoice.followUpChoices);
                    gameState.choicesAvailable = true;
                }
                // Check if there's a next dialogue after the modal
                else if (gameState.currentChoice && gameState.currentChoice.nextDialogue) {
                    gameState.currentDialogue = gameState.currentChoice.nextDialogue;
                    gameState.dialogueIndex = 0;
                    showNextDialogue();
                }
                // Default: ensure choices render if nothing else
                else if (gameState.currentSceneData.choices && !gameState.choicesAvailable) {
                    showChoices(gameState.currentSceneData.choices);
                    gameState.choicesAvailable = true;
                }
        }, 300);
    }
        // Puzzle Function
        function checkPuzzleAnswer() {
            const answer = document.getElementById('puzzle-answer').value.toLowerCase();
            const feedback = document.getElementById('puzzle-feedback');
            
            if (answer === 'eureka') {
                feedback.textContent = 'Correct! You solved the puzzle.';
                gameState.inventory.push('Artifact Code');
                setTimeout(closeModal, 1500);
            } else {
                feedback.textContent = 'Incorrect. Please try again.';
            }
        }

        // Inventory/Journal Functions
        function openInventory() {
            let content = `
                <h2 style="color: #4a9eff; margin-bottom: 20px;">Journal Entries</h2>
                ${gameState.journal.length > 0 ? 
                    '<ul style="list-style-type: none; padding: 0;">' + 
                    gameState.journal.map(entry => `<li style="padding: 10px; margin: 5px 0; background: rgba(74, 158, 255, 0.1); border-radius: 5px;">📝 ${entry}</li>`).join('') + 
                    '</ul>' : 
                    '<p style="color: #888;">Your journal is empty.</p>'}

                <h2 style="color: #4a9eff; margin: 20px 0;">Inventory Items</h2>
                ${gameState.inventory.length > 0 ? 
                    '<ul style="list-style-type: none; padding: 0;">' + 
                    gameState.inventory.map(item => `<li style="padding: 10px; margin: 5px 0; background: rgba(74, 158, 255, 0.1); border-radius: 5px;">📦 ${item}</li>`).join('') + 
                    '</ul>' : 
                    '<p style="color: #888;">Your inventory is empty.</p>'}
            `;

            openModal(content);
        }

        // Chapter Links
        function populateChapterLinks() {
            const chapterLinksContainer = document.getElementById('chapter-links');
            chapterLinksContainer.innerHTML = '';

            Object.entries(scenes).forEach(([sceneKey, scene]) => {
                const link = document.createElement('a');
                link.href = 'javascript:void(0)';
                link.classList.add('chapter-link');
                link.textContent = scene.displayName || sceneKey;
                link.onclick = () => {
                    loadScene(sceneKey);
                    document.getElementById('sidebar-menu').style.width = '0';
                };
                chapterLinksContainer.appendChild(link);
            });
        }

        // Event Listeners
        function initializeEventListeners() {
            document.getElementById('progress-button').addEventListener('click', showNextDialogue);
            document.getElementById('inventory-button').addEventListener('click', openInventory);
            document.getElementById('modal-close-button').addEventListener('click', closeModal);
            document.getElementById('hamburger-icon').addEventListener('click', () => {
                document.getElementById('sidebar-menu').style.width = '250px';
            });
            document.getElementById('close-button').addEventListener('click', () => {
                document.getElementById('sidebar-menu').style.width = '0';
            });
        }

        // Initialize Game
        function initializeGame() {
            initializeEventListeners();
            document.getElementById('crew-reputation').textContent = gameState.crewReputation;
            document.getElementById('captain-trust').textContent = gameState.captainTrust;
            loadScene(gameState.currentScene);
            populateChapterLinks();
        }

        // Start game when document is ready
        window.onload = initializeGame;
    </script>
</body>
</html>
